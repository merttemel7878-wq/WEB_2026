<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #Header {
            background-color: orange;
            border: 1px solid darkblue;
            width: 904px;
            height: 60px;
            line-height: 25px;
            text-align: center;
        }
        #Navigation {
            background-color: purple;
            border: 1px solid darkblue;
            width: 200px;
            height: 500px;
            line-height: 400px;
            text-align: center;
            float: left;
        }
        #Section {
            background-color: rgb(226, 4, 178);
            border: 1px solid darkblue;
            width: 500px;
            height: 500px;
            line-height: 25px;
            text-align: center;
            float: left;
        }
        #aside {
            background-color: lightblue;
            border: 1px solid darkblue;
            width: 200px;
            height: 500px;
            line-height: 400px;
            text-align: center;
            float: left;
        }
        #footer {
            background-color: darkgray;
            border: 1px solid darkblue;
            width: 904px;
            height: 60px;
            line-height: 25px;
            text-align: center;
            clear: left;
        }
        #sheader {
            background-color: rgb(1, 197, 155);
            border: 1px solid darkblue;
            width: 90%;
            height: 100px;
            line-height: 25px;
            text-align: center;
            margin:auto auto;
        }
        #article {
            background-color: rgb(212, 7, 41);
            border: 1px solid darkblue;
            width: 90%;
            height: 100px;
            line-height: 25px;
            text-align: center;
            margin:20px auto;
        }
        #sfooter {
            background-color: rgb(219, 198, 6);
            border: 1px solid darkblue;
            width: 90%;
            height: 100px;
            line-height: 25px;
            text-align: center;
            margin:auto auto;
        }
    </style>
</head>
<body>
    <div id="container">
    <header><h1>Header</h1></header>
    <nav><h1>Navigation</h1></nav>
    <section><h1>Section</section>
            <shead><h1>Header</h1></shead>
          <article><h1>Article</h1></article>
         <sfooter><h1>Footer</h1></sfooter>
    </div>
    <aside><h1>Aside</h1></aside>
    <footer><h1>Footer</h1></footer>
    </div>
</body>
</html>
