<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        header {
            background-color: crimson;
            border: 5px solid black;
            color: black;
            height: 80px;
            line-height: 80px;
            text-align: center;
            font-size: 24px;
            margin: 10px;
            }
            nav {
                background-color: aqua;
                border: 5px solid black;
                color: black;
                height: 80px;
                line-height: 80px;
                text-align: center;
                font-size: 24px;
                margin: 10px;
            }
            section {
                float: left;
                background-color: yellow;
                border: 5px solid black;
                color: black;
                text-align: center;
                font-size: 24px;
                margin: 10px;
                height: 220px;
                width: 70%;
                article {
                    float: left;
                    background-color: orange;
                    border: 3px solid black;
                    color: black;
                    text-align: center;
                    font-size: 24px;
                    margin: 5px;
                }
            }
            aside {
                float: left;
                background-color: green;
                border: 5px solid black;
                color: black;
                height: 80px;
                line-height: 80px;
                text-align: center;
                font-size: 24pt;
                margin: 10px;
                height: 220px;
                width: 24%;
            }
            footer {
                clear: both;
                background-color: grey;
                border: 5px solid black;
                color: black;
                height: 80px;
                line-height: 80px;
                text-align: center;
                font-size: 24pt;
                margin: 10px;
            }
    </style>









    <header>header</header>
    <nav>nav</nav>
    <section>section</section>
    <article>article</article>
    <aside>aside</aside>
    <footer>footer</footer>
</body>
</html>
